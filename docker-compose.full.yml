# Docker Compose - All Amaz Backend Services
# Run: docker compose -f docker-compose.full.yml up -d
# Build: docker compose -f docker-compose.full.yml up -d --build

services:
  mysql:
    image: mysql:8
    container_name: amaz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: amaz_root
      MYSQL_DATABASE: bd_final_projet_annuel
      MYSQL_USER: amaz
      MYSQL_PASSWORD: amaz
    # Pas de publication de 3306 vers l'hôte : les services accèdent à MySQL par le réseau
    # Docker interne (MYSQL_HOST=mysql). Évite tout conflit avec un MySQL déjà installé sur l'hôte.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7.0
    container_name: amaz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\""]
      interval: 5s
      timeout: 5s
      retries: 10

  pepper-service:
    build:
      context: .
      dockerfile: services/pepper-service/Dockerfile
    container_name: amaz-pepper
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      PEPPER_SERVICE_PORT: 3006
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
      PEPPER_MASTER_SECRET: ${PEPPER_MASTER_SECRET:-change-pepper-master-secret}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3006/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pepper-primary:
    build:
      context: .
      dockerfile: services/pepper-service/Dockerfile
    container_name: amaz-pepper-primary
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: development
      PEPPER_SERVICE_PORT: 3007
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
      PEPPER_MASTER_SECRET: ${PEPPER_PRIMARY_MASTER_SECRET:-change-pepper-primary-master-secret}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3007/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: amaz-user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    environment:
      NODE_ENV: development
      USER_SERVICE_PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: amaz
      MYSQL_PASSWORD: amaz
      MYSQL_DATABASE: bd_final_projet_annuel
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
      ACCESS_HMAC_SECRET: ${ACCESS_HMAC_SECRET:-change-access-hmac-secret}
      REFRESH_HMAC_SECRET: ${REFRESH_HMAC_SECRET:-change-refresh-hmac-secret}
      PEPPER_CLIENT_SECRET: ${PEPPER_CLIENT_SECRET:-change-pepper-client-secret}
      PEPPER_PRIMARY_CLIENT_SECRET: ${PEPPER_PRIMARY_CLIENT_SECRET:-change-pepper-primary-client-secret}
      PEPPER_SERVICE_URL: http://pepper-service:3006
      PEPPER_PRIMARY_URL: http://pepper-primary:3007
    depends_on:
      mysql:
        condition: service_healthy
      pepper-service:
        condition: service_healthy
      pepper-primary:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: amaz-product-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: development
      PRODUCT_SERVICE_PORT: 3002
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: amaz_db
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
    depends_on:
      mongo:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: amaz-order-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: development
      ORDER_SERVICE_PORT: 3003
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: amaz
      MYSQL_PASSWORD: amaz
      MYSQL_DATABASE: bd_final_projet_annuel
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
      PRODUCTS_SERVICE_URL: http://product-service:3002
    depends_on:
      mysql:
        condition: service_healthy

  messaging-service:
    build:
      context: .
      dockerfile: services/messaging-service/Dockerfile
    container_name: amaz-messaging-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: development
      MESSAGING_SERVICE_PORT: 3004
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: amaz_db
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
    depends_on:
      mongo:
        condition: service_healthy

  returns-service:
    build:
      context: .
      dockerfile: services/returns-service/Dockerfile
    container_name: amaz-returns-service
    restart: unless-stopped
    ports:
      - "3008:3008"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3008/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: development
      RETURNS_SERVICE_PORT: 3008
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: amaz
      MYSQL_PASSWORD: amaz
      MYSQL_DATABASE: bd_final_projet_annuel
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: amaz-ai-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: development
      AI_SERVICE_PORT: 3005
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: amaz_db
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
    depends_on:
      mongo:
        condition: service_healthy

  # Lance migrations + seed + init Mongo contre le MySQL/Mongo de CE compose (évite un décalage avec une DB hôte).
  bootstrap:
    image: node:20-alpine
    container_name: amaz-bootstrap
    profiles:
      - tools
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NODE_ENV: development
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: amaz
      MYSQL_PASSWORD: amaz
      MYSQL_DATABASE: bd_final_projet_annuel
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: amaz_db
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Amaz@2026!}
      PEPPER_SERVICE_URL: http://pepper-service:3006
      PEPPER_PRIMARY_URL: http://pepper-primary:3007
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
      ACCESS_HMAC_SECRET: ${ACCESS_HMAC_SECRET:-change-access-hmac-secret}
      REFRESH_HMAC_SECRET: ${REFRESH_HMAC_SECRET:-change-refresh-hmac-secret}
      PEPPER_CLIENT_SECRET: ${PEPPER_CLIENT_SECRET:-change-pepper-client-secret}
      PEPPER_PRIMARY_CLIENT_SECRET: ${PEPPER_PRIMARY_CLIENT_SECRET:-change-pepper-primary-client-secret}
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      pepper-service:
        condition: service_healthy
      pepper-primary:
        condition: service_healthy
    command: node scripts/db-bootstrap.js

  seed:
    image: node:20-alpine
    container_name: amaz-seed
    profiles:
      - tools
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NODE_ENV: development
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: amaz
      MYSQL_PASSWORD: amaz
      MYSQL_DATABASE: bd_final_projet_annuel
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Amaz@2026!}
      PEPPER_SERVICE_URL: http://pepper-service:3006
      PEPPER_PRIMARY_URL: http://pepper-primary:3007
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
      ACCESS_HMAC_SECRET: ${ACCESS_HMAC_SECRET:-change-access-hmac-secret}
      REFRESH_HMAC_SECRET: ${REFRESH_HMAC_SECRET:-change-refresh-hmac-secret}
      PEPPER_CLIENT_SECRET: ${PEPPER_CLIENT_SECRET:-change-pepper-client-secret}
      PEPPER_PRIMARY_CLIENT_SECRET: ${PEPPER_PRIMARY_CLIENT_SECRET:-change-pepper-primary-client-secret}
    depends_on:
      mysql:
        condition: service_healthy
      pepper-service:
        condition: service_healthy
      pepper-primary:
        condition: service_healthy
    command: node db/mysql/seed.js

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: amaz-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      GATEWAY_PORT: 3000
      GATEWAY_HOST: 0.0.0.0
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
      USERS_SERVICE_URL: http://user-service:3001
      PRODUCTS_SERVICE_URL: http://product-service:3002
      ORDERS_SERVICE_URL: http://order-service:3003
      MESSAGING_SERVICE_URL: http://messaging-service:3004
      RETURNS_SERVICE_URL: http://returns-service:3008
      AI_SERVICE_URL: http://ai-service:3005
      PEPPER_SERVICE_URL: http://pepper-service:3006
      PEPPER_PRIMARY_URL: http://pepper-primary:3007
      # Include 127.0.0.1 — browsers treat it as a different origin than "localhost"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201,http://localhost:4202,http://127.0.0.1:4200,http://127.0.0.1:4201,http://127.0.0.1:4202}
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      returns-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      pepper-service:
        condition: service_healthy
      pepper-primary:
        condition: service_healthy

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: amaz-admin-service
    # AdminJS = back-office d'exploitation (pas dans le chemin de l'API). On le met
    # derrière un profil : `docker compose up` démarre l'API + les bases (tout le
    # fonctionnel), et AdminJS se lance à la demande :
    #   docker compose -f docker-compose.full.yml --profile admin up -d admin-service
    profiles:
      - admin
    restart: unless-stopped
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3010/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: development
      ADMIN_SERVICE_PORT: 3010
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: amaz
      MYSQL_PASSWORD: amaz
      MYSQL_DATABASE: bd_final_projet_annuel
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-this-internal-secret}
    depends_on:
      mysql:
        condition: service_healthy

  # --- Frontends Angular (build + service statique via nginx) ---
  # Le contexte pointe vers les dépôts frères (../users, ../vendors, ../qa-lab) :
  # cloner les dépôts dans un même dossier parent, à côté de Amaz_back.
  users-app:
    build:
      context: ../users
    container_name: amaz-users-app
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - gateway

  vendors-app:
    build:
      context: ../vendors
    container_name: amaz-vendors-app
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      - gateway

  qa-lab-app:
    build:
      context: ../qa-lab
    container_name: amaz-qa-lab-app
    restart: unless-stopped
    ports:
      - "4202:80"
    depends_on:
      - gateway

volumes:
  mysql_data:
  mongo_data:
