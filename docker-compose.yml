services:
  postgres:
    image: postgres:16-alpine
    container_name: amaz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amaz
      POSTGRES_PASSWORD: amaz
      POSTGRES_DB: amaz_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amaz -d amaz_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: amaz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\""]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    image: node:20-alpine
    container_name: amaz-seed
    profiles:
      - tools
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: amaz
      PG_PASSWORD: amaz
      PG_DATABASE: amaz_db
      PG_SSL: "false"
      PEPPER_CLIENT_SECRET: ${PEPPER_CLIENT_SECRET:-change-pepper-client-secret}
      PEPPER_PRIMARY_CLIENT_SECRET: ${PEPPER_PRIMARY_CLIENT_SECRET:-change-pepper-primary-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
    command: node db/postgres/seed.js

volumes:
  pg_data:
  mongo_data:
